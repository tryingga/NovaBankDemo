name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Seleziona la versione più recente di Xcode disponibile
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Uso: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila app (senza firma)
        run: |
          xcodebuild \
            -project NovaBankDemo.xcodeproj \
            -scheme NovaBankDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Crea file IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/NovaBankDemo.app" Payload/
          zip -r NovaBankDemo.ipa Payload

      - name: Carica IPA come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: NovaBankDemo-ipa
          path: NovaBankDemo.ipa
